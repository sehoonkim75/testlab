<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCT 문장완성검사 온라인 서비스</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%232F5D57'/%3E%3Ctext x='50' y='63' font-family='Georgia,serif' font-size='42' fill='%23F5F2EC' text-anchor='middle'%3ESCT%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    /* ── 화이트 팔레트 — 밝고 또렷한 임상 기록지 톤 ── */
    --paper:#F7F7F4; --sheet:#FFFFFF; --sheet-raised:#FFFFFF;
    --ink:#211F1A; --ink-soft:#68635A; --ink-faint:#9D978A;
    --rule:#E7E4DC; --rule-soft:#F1EFE9;
    --accent:#2F5D57; --accent-ink:#1E413C; --accent-tint:#E7F0EE;
    --pos:#3F6A3B; --pos-tint:#EAF3E8;
    --neu:#6B6559; --neu-tint:#F1EFE8;
    --caution:#93650F; --caution-tint:#FBF1DD;
    --warn:#A23A30; --warn-tint:#FBEAE7;

    /* 영역별 색인 색 — 종이 위 색연필 톤 */
    --fam-c:#3E5480; --fam-bg:#EBEFF7;
    --rel-c:#9C4258; --rel-bg:#F8EAEE;
    --soc-c:#3F6A3B; --soc-bg:#EAF3E8;
    --self-c:#69406E; --self-bg:#F2E9F3;
    --emo-c:#93650F; --emo-bg:#FBF1DD;

    --radius:10px; --radius-sm:6px;
    --shadow:0 1px 2px rgba(33,31,26,.04),0 6px 20px rgba(33,31,26,.05);
    --serif:'Gowun Batang','Noto Serif KR',Georgia,serif;
    --sans:'Noto Sans KR','Pretendard',-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }

  [data-domain="FAM"]{--dc:var(--fam-c);--dbg:var(--fam-bg);}
  [data-domain="REL"]{--dc:var(--rel-c);--dbg:var(--rel-bg);}
  [data-domain="SOC"]{--dc:var(--soc-c);--dbg:var(--soc-bg);}
  [data-domain="SELF"]{--dc:var(--self-c);--dbg:var(--self-bg);}
  [data-domain="EMO"]{--dc:var(--emo-c);--dbg:var(--emo-bg);}

  *{box-sizing:border-box;margin:0;padding:0;}
  *:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001s !important;transition-duration:.001s !important;} }
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;font-size:14.5px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;color:inherit;}
  h1,h2,h3{font-family:var(--serif);text-wrap:balance;}

  /* ── 표제부 ── */
  .masthead{border-bottom:1px solid var(--rule);background:var(--sheet);position:sticky;top:0;z-index:100;}
  .mast-row{max-width:720px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;gap:16px;}
  .mast-mark{font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:.06em;color:var(--accent);border:1.5px solid var(--accent);border-radius:5px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .mast-text h1{font-size:18px;font-weight:700;color:var(--ink);line-height:1.2;}
  .mast-text p{font-size:11.5px;color:var(--ink-faint);letter-spacing:.04em;margin-top:2px;}
  .mast-row .spacer{flex:1;}
  .gear-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);background:var(--sheet-raised);font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:border-color .15s,color .15s;}
  .gear-btn:hover{border-color:var(--accent);color:var(--accent);}

  .layout{max-width:720px;margin:0 auto;padding:0 24px 90px;display:flex;flex-direction:column;gap:22px;}

  /* ── 색인(탭) ── */
  .index{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-top:22px;}
  .index-item{background:none;border:none;padding:13px 4px;margin-right:26px;font-size:13.5px;font-weight:500;color:var(--ink-faint);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;display:flex;align-items:center;gap:6px;}
  .index-item .icon{font-size:15px;opacity:.85;}
  .index-item .index-no{font-family:var(--serif);font-size:12px;opacity:.75;}
  .index-item:hover{color:var(--ink-soft);}
  .index-item.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}

  .card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .card-header{padding:16px 22px;border-bottom:1px solid var(--rule-soft);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .card-header h2{font-size:14.5px;font-weight:700;color:var(--ink);letter-spacing:.01em;display:flex;align-items:center;gap:7px;}
  .card-header h2 .icon{color:var(--accent);font-size:1.2em;}
  .report-domain-head strong{display:flex;align-items:center;gap:6px;}
  .card-body{padding:22px;}
  .muted{color:var(--ink-soft);font-size:12px;}

  .badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--accent-tint);color:var(--accent-ink);font-variant-numeric:tabular-nums;}

  /* ── 버튼 ── */
  .btn{padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;border:1px solid var(--rule);background:var(--sheet-raised);color:var(--ink);transition:border-color .15s,color .15s,background .15s;}
  .btn:hover{border-color:var(--ink-faint);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--sheet);}
  .btn-primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-danger{color:var(--warn);border-color:var(--rule);}
  .btn-danger:hover{border-color:var(--warn);}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .btn-row{display:flex;gap:9px;flex-wrap:wrap;}

  /* ── 진행률 ── */
  .progress-wrap{display:flex;align-items:center;gap:10px;}
  .progress-bar{flex:1;height:5px;background:var(--rule-soft);border-radius:20px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);border-radius:20px;transition:width .25s;}
  .progress-num{font-size:12px;font-weight:600;color:var(--accent);font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;}

  /* ── 응답자 정보 ── */
  .form-row{display:flex;gap:14px;flex-wrap:wrap;}
  .form-field{flex:1;min-width:160px;}
  .form-field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;letter-spacing:.02em;}
  .form-field input{width:100%;padding:9px 2px;border:none;border-bottom:1.5px solid var(--rule);background:transparent;font-size:13.5px;outline:none;transition:border-color .15s;}
  .form-field input:focus{border-color:var(--accent);}

  /* ── 영역 구획 ── */
  .domain-section{margin-bottom:26px;}
  .domain-section:last-child{margin-bottom:0;}
  .domain-title{display:flex;align-items:center;gap:9px;padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--rule-soft);}
  .domain-title .icon{color:var(--dc);font-size:15px;}
  .domain-title strong{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--dc);}
  .domain-title .cnt{margin-left:auto;font-size:11px;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-faint);}

  /* 문항을 "빈칸 채우기" 형태로 — 실제 SCT 용지의 문장 완성 방식을 그대로 재현 */
  .item-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;padding:11px 2px;border-bottom:1px dotted var(--rule);}
  .item-row:last-child{border-bottom:none;}
  .item-num{font-size:11.5px;font-weight:600;color:var(--ink-faint);font-family:var(--mono);font-variant-numeric:tabular-nums;flex-shrink:0;}
  .item-stem{font-size:14px;color:var(--ink);flex-shrink:0;}
  .item-input{flex:1;min-width:140px;padding:1px 4px 2px;border:none;border-bottom:1.5px solid var(--rule);background:transparent;font-size:15px;color:var(--accent-ink);resize:none;overflow:hidden;outline:none;line-height:25px;letter-spacing:.005em;transition:border-color .15s;font-family:var(--serif);}
  .item-input::placeholder{color:var(--ink-faint);font-style:italic;font-family:var(--sans);}
  .item-input:focus{border-color:var(--accent);}
  @media (max-width:560px){.item-row{gap:4px 0;}.item-input{width:100%;flex-basis:100%;margin-left:0;}}

  /* ── 문항 관리 표 ── */
  .manage-row{display:flex;gap:8px;padding:9px 4px;border-bottom:1px solid var(--rule-soft);align-items:center;}
  .manage-row select{padding:7px 8px;border:1px solid var(--rule);border-radius:var(--radius-sm);font-size:12px;background:var(--sheet-raised);width:130px;flex-shrink:0;}
  .manage-row input[type=text]{flex:1;padding:7px 9px;border:1px solid var(--rule);border-radius:var(--radius-sm);font-size:13px;background:var(--sheet-raised);}
  .manage-row input[type=text]:focus,.manage-row select:focus{border-color:var(--accent);}
  .manage-row .order-btns{display:flex;flex-direction:column;gap:2px;}
  .order-btns button{width:20px;height:16px;font-size:9px;line-height:1;border:1px solid var(--rule);background:var(--sheet-raised);border-radius:3px;color:var(--ink-soft);}
  .icon-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--rule);background:var(--sheet-raised);font-size:12px;flex-shrink:0;color:var(--ink-soft);}
  .icon-btn:hover{background:var(--warn-tint);border-color:var(--warn);color:var(--warn);}

  /* ── 톤 배지 ── */
  .tone{font-size:11px;font-weight:700;padding:3px 11px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;letter-spacing:.02em;}
  .tone .icon{font-size:1.15em;}
  .tone-pos{background:var(--pos-tint);color:var(--pos);}
  .tone-neu{background:var(--neu-tint);color:var(--neu);}
  .tone-caution{background:var(--caution-tint);color:var(--caution);}
  .tone-warn{background:var(--warn-tint);color:var(--warn);}

  .chip{display:inline-block;font-size:11.5px;padding:4px 11px;border-radius:20px;background:var(--accent-tint);color:var(--accent-ink);margin:0 6px 6px 0;font-weight:500;}
  .chip-warn{background:var(--warn-tint);color:var(--warn);}
  .chip-pos{background:var(--pos-tint);color:var(--pos);}

  .report-domain{border:1px solid var(--rule);border-left:3px solid var(--dc);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:16px 18px;margin-bottom:12px;background:var(--sheet-raised);}
  .report-domain:last-child{margin-bottom:0;}
  .report-domain-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap;}
  .report-domain-head strong{font-family:var(--serif);font-size:14.5px;font-weight:700;color:var(--dc);}
  .report-domain p{font-size:13.5px;color:var(--ink);line-height:1.75;white-space:pre-wrap;}

  .disclaimer{font-size:11.5px;color:var(--ink-faint);border-top:1px dashed var(--rule);padding-top:14px;margin-top:18px;line-height:1.7;}

  .empty-state{text-align:center;padding:64px 20px;color:var(--ink-soft);}
  .empty-state .es-icon{width:34px;height:34px;margin:0 auto 14px;opacity:.5;}
  .empty-state .es-icon svg{width:100%;height:100%;stroke:var(--ink-soft);fill:none;stroke-width:1.3;}

  /* ── 라인 아이콘 ── */
  .icon{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.16em;flex-shrink:0;}

  .loading-overlay{position:fixed;inset:0;background:color-mix(in srgb, var(--paper) 88%, transparent);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:1000;}
  .loading-overlay.show{display:flex;}
  .spinner{width:30px;height:30px;border:2.5px solid var(--accent-tint);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .settings-panel{position:fixed;top:64px;right:24px;background:var(--sheet-raised);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;width:270px;display:none;z-index:200;}
  .settings-panel.show{display:block;}
  .settings-panel h3{font-family:var(--serif);font-size:13.5px;margin-bottom:12px;color:var(--ink);}
  .settings-panel select{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:var(--radius-sm);font-size:12.5px;background:var(--sheet);margin-bottom:10px;}
  .settings-panel .note{font-size:11px;color:var(--ink-faint);line-height:1.6;}

  /* ── 첫 화면 안내(SCT 소개 + 기능 가이드) ── */
  .intro-card{border-left:3px solid var(--accent);}
  .intro-eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--accent);margin-bottom:8px;}
  .intro-title{display:flex;align-items:center;gap:8px;font-size:18px;margin-bottom:10px;}
  .intro-title .icon{color:var(--accent);font-size:1.05em;}
  .intro-lead{font-size:13.5px;color:var(--ink-soft);line-height:1.8;margin-bottom:22px;word-break:keep-all;}
  .intro-lead b{color:var(--ink);font-weight:600;}
  .feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;}
  @media (max-width:560px){.feature-grid{grid-template-columns:1fr;}}
  .feature-item{display:flex;gap:12px;align-items:flex-start;}
  .feature-icon{width:34px;height:34px;border-radius:9px;background:var(--accent-tint);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;}
  .feature-item strong{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:3px;}
  .feature-item p{font-size:12.5px;color:var(--ink-soft);line-height:1.6;}

  /* ── 검사 모드 선택 ── */
  .mode-intro{font-size:13px;color:var(--ink-soft);margin-bottom:16px;line-height:1.7;}
  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:560px){.mode-grid{grid-template-columns:1fr;}}
  .mode-card{border:1px solid var(--rule);border-radius:var(--radius);padding:20px;background:var(--sheet-raised);text-align:left;transition:border-color .15s,transform .15s;width:100%;}
  .mode-card:hover{border-color:var(--accent);transform:translateY(-1px);}
  .mode-card-icon{width:36px;height:36px;border-radius:10px;background:var(--accent-tint);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:12px;}
  .mode-card .mode-eyebrow{font-size:10.5px;letter-spacing:.09em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:9px;}
  .mode-card h3{font-family:var(--serif);font-size:16.5px;font-weight:700;color:var(--ink);margin-bottom:7px;}
  .mode-card p{font-size:12.5px;color:var(--ink-soft);line-height:1.65;}
  .mode-switch{font-size:11.5px;color:var(--ink-faint);background:none;border:none;text-decoration:underline;text-underline-offset:3px;padding:0;margin-bottom:16px;}
  .mode-switch:hover{color:var(--accent);}

  /* ── 검사대상자: 1문항 1화면 ── */
  .subject-stage{padding:38px 4px 6px;text-align:center;}
  .subject-domain{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.03em;padding:4px 13px;border-radius:20px;background:var(--dbg);color:var(--dc);margin-bottom:24px;}
  .subject-domain .icon{font-size:1.2em;}
  .subject-stem{font-family:var(--serif);font-size:22px;line-height:1.55;color:var(--ink);margin-bottom:24px;text-wrap:balance;}
  .subject-input-wrap{max-width:440px;margin:0 auto 32px;}
  .subject-input{width:100%;text-align:center;padding:10px 4px 8px;border:none;border-bottom:2px solid var(--rule);background:transparent;font-size:18px;color:var(--accent-ink);outline:none;font-family:var(--serif);resize:none;overflow:hidden;line-height:30px;letter-spacing:.005em;transition:border-color .15s;}
  .subject-input::placeholder{font-family:var(--sans);font-size:14px;}
  .subject-input:focus{border-color:var(--accent);}
  .subject-nav{display:flex;justify-content:center;gap:10px;}

  /* ── 응답 시간 요약 ── */
  .timing-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule-soft);font-size:13px;}
  .timing-row:last-child{border-bottom:none;}
  .timing-row .t-label{color:var(--ink-soft);}
  .timing-row .t-val{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);}

  /* ── 문항별 응답 내역 표 ── */
  .answer-log-wrap{max-height:560px;overflow:auto;border:1px solid var(--rule);border-radius:var(--radius-sm);}
  .answer-log{width:100%;border-collapse:collapse;font-size:12.5px;}
  .answer-log th{position:sticky;top:0;text-align:left;font-size:10.5px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--rule);background:var(--sheet-raised);white-space:nowrap;}
  .answer-log td{padding:9px 12px;border-bottom:1px solid var(--rule-soft);vertical-align:top;color:var(--ink);}
  .answer-log tr:last-child td{border-bottom:none;}
  .answer-log .al-num{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-faint);}
  .answer-log .al-domain{font-size:11.5px;font-weight:600;color:var(--dc);white-space:nowrap;}
  .answer-log .al-stem{color:var(--ink-soft);white-space:nowrap;}
  .answer-log .al-blank{color:var(--ink-faint);font-style:italic;}
  .answer-log .al-time{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-soft);white-space:nowrap;text-align:right;}
  @media print{ .answer-log-wrap{max-height:none;overflow:visible;} .answer-log th{position:static;} }

  @media print{
    .masthead,.index,.btn-row,.gear-btn,#settingsPanel,.mode-switch,.subject-nav,.no-print{display:none !important;}
    body{background:#fff;}
    .layout{padding:0;max-width:100%;}
    .card{box-shadow:none;border:none;}
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="mast-row">
    <div class="mast-mark">SCT</div>
    <div class="mast-text">
      <h1>문장완성검사</h1>
      <p>SENTENCE COMPLETION TEST · 온라인 검사지</p>
    </div>
    <div class="spacer"></div>
    <button class="gear-btn no-print" onclick="toggleSettings()" aria-label="분석 설정">⚙</button>
  </div>
</header>

<div class="settings-panel no-print" id="settingsPanel">
  <h3>분석 설정</h3>
  <label class="muted" style="display:block;margin-bottom:4px;">분석 모델</label>
  <select id="modelSelect" onchange="saveModel()">
    <option value="gpt-4o">gpt-4o (권장·정확)</option>
    <option value="gpt-4.1">gpt-4.1 (최신)</option>
    <option value="gpt-4o-mini">gpt-4o-mini (빠름·저렴)</option>
  </select>
  <p class="note">OpenAI API 키는 화면에 입력하지 않습니다. 이 HTML 파일을 텍스트 편집기로 열어 스크립트 상단의 <b>EMBEDDED_API_KEY</b> 값을 채운 뒤 배포하세요. 키가 없으면 AI 해석 대신 규칙 기반의 간이 요약이 제공됩니다.</p>
</div>

<div class="loading-overlay no-print" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="muted">AI가 응답을 분석하고 리포트를 작성하는 중입니다…</div>
</div>

<div class="layout">
  <nav class="index no-print">

<script>

/* ──────────────────────────────────────────
   상태 & 로컬 저장
   ────────────────────────────────────────── */
const LS = {
  items:'sct_items_v1', responses:'sct_responses_v1',
  respondent:'sct_respondent_v1', report:'sct_report_v1', model:'sct_model_v1',
  timings:'sct_timings_v1', mode:'sct_mode_v1',
};

function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

let items = loadJSON(LS.items, null) || DEFAULT_ITEMS.map(x=>({...x}));
let responses = loadJSON(LS.responses, {});
let itemTimings = loadJSON(LS.timings, {});      // { itemId: 응답까지 걸린 ms } — 검사대상자 모드에서만 기록
let respondent = loadJSON(LS.respondent, { name:'', memo:'' });
let lastReport = loadJSON(LS.report, null);
let testMode = loadJSON(LS.mode, null);          // 'clinician' | 'subject' | null(선택 전)
let subjectIdx = 0;         // 검사대상자 모드: 현재 문항 위치 (세션 내에서만 유지)
let subjectShownAt = null;  // 검사대상자 모드: 현재 문항이 화면에 표시된 시각(ms)
let subjectStarted = false; // 검사대상자 모드: 시작 화면을 지나 실제 문항 진행 중인지
let activeTab = 'test';

function domainOf(id){ return DOMAINS.find(d=>d.id===id) || DOMAINS[0]; }
function nextItemId(){ return items.reduce((m,it)=>Math.max(m,it.id),0)+1; }

/* ──────────────────────────────────────────
   유틸
   ────────────────────────────────────────── */
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toneClass(t){
  if(t==='긍정적') return 'tone-pos';
  if(t==='다소_우려') return 'tone-caution';
  if(t==='주의_필요') return 'tone-warn';
  return 'tone-neu';
}
function toneLabel(t){
  return ({'긍정적':'긍정적','중립적':'중립적','다소_우려':'다소 우려','주의_필요':'주의 필요'})[t] || (t||'중립적');
}
function toneBadge(t){
  return `<span class="tone ${toneClass(t)}">${icon(toneIcon(t))}${toneLabel(t)}</span>`;
}
function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}
const ES_ICONS = {
  folder: '<svg viewBox="0 0 24 24"><path d="M3 6.5a1 1 0 0 1 1-1h5l2 2.2h9a1 1 0 0 1 1 1V18a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>',
  doc: '<svg viewBox="0 0 24 24"><path d="M6 2.5h9l4 4V21a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1z"/><path d="M14 2.5V7h4M8.5 12h7M8.5 15.5h7M8.5 8.5h3"/></svg>',
};
function esIcon(name){ return `<div class="es-icon">${ES_ICONS[name]||''}</div>`; }

/* ── 라인 아이콘 세트 (24x24, stroke 기반) ── */
const ICON_PATHS = {
  pencil:   '<path d="M4 20l.9-4.2L15.3 5.4a1.5 1.5 0 0 1 2.1 0l1.2 1.2a1.5 1.5 0 0 1 0 2.1L8.2 19.1 4 20z"/><path d="M13.5 7.2l3.3 3.3"/>',
  sliders:  '<path d="M4 6h9M17 6h3M4 12h3M9 12h11M4 18h13M19 18h1"/><circle cx="11.5" cy="6" r="1.7"/><circle cx="6.5" cy="12" r="1.7"/><circle cx="16.5" cy="18" r="1.7"/>',

  home:     '<path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9.5a1 1 0 0 0 1 1h3.5v-6h3v6H17a1 1 0 0 0 1-1V10"/>',

  userCircle:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="10" r="3"/><path d="M6 19c1.2-2.5 3.4-4 6-4s4.8 1.5 6 4"/>',

  check:    '<circle cx="12" cy="12" r="8.5"/><path d="M8 12.3l2.6 2.6L16.2 9"/>',

  clipboard:'<rect x="5.5" y="4.5" width="13" height="16" rx="2"/><rect x="9" y="3" width="6" height="3" rx="1"/><path d="M8.5 11h7M8.5 14.5h7M8.5 17.5h4.5"/>',
  edit3:    '<path d="M12 20h9"/><path d="M4.5 20l.7-3.2L15.6 6.4a1.4 1.4 0 0 1 2 0l1 1a1.4 1.4 0 0 1 0 2L8.2 19.8 4.5 20z"/>',
  book:     '<path d="M4 5.5A2 2 0 0 1 6 4h12v14.5H6a2 2 0 0 0-2 1.5"/><path d="M4 5.5v14.5"/><path d="M8.5 8h6M8.5 11h6"/>',
};
function icon(name, cls){ return `<svg class="icon ${cls||''}" viewBox="0 0 24 24">${ICON_PATHS[name]||''}</svg>`; }
const DOMAIN_ICON = { FAM:'home', REL:'heart', SOC:'users', SELF:'userCircle', EMO:'pulse' };
function toneIcon(t){
  if(t==='긍정적') return 'check';
  if(t==='다소_우려' || t==='주의_필요') return 'alert';
  return 'minus';
}
function formatMs(ms){
  if(ms==null) return '—';
  const s = ms/1000;
  return s<60 ? `${s.toFixed(1)}초` : `${Math.floor(s/60)}분 ${Math.round(s%60)}초`;
}

/* ──────────────────────────────────────────
   탭 전환 & 렌더 라우터
   ────────────────────────────────────────── */
function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.index-item').forEach(el=>el.classList.toggle('active', el.dataset.tab===tab));
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function render(){
  const el = document.getElementById('tabContent');
  if(activeTab==='test') el.innerHTML = renderTestTab();
  else if(activeTab==='manage') el.innerHTML = renderManageTab();
  else if(activeTab==='batch') el.innerHTML = renderBatchTab();
  else el.innerHTML = renderReportTab();
  if(activeTab==='test'){
    el.querySelectorAll('.item-input').forEach(autoGrow);
    const subj = document.getElementById('subjectAnswerInput');
    if(subj){ autoGrow(subj); subj.focus(); const v=subj.value; subj.value=''; subj.value=v; }
  }
}

/* ──────────────────────────────────────────
   ① 검사 실시 탭
   ────────────────────────────────────────── */
function answeredCount(){
  return items.filter(it => (responses[it.id]||'').trim().length>0).length;
}
function respondentFields(){
  return `
    <div class="form-row">
      <div class="form-field">
        <label>이름 / 닉네임</label>
        <input type="text" value="${escapeHtml(respondent.name)}" placeholder="예: 홍길동"
          oninput="respondent.name=this.value; saveJSON(LS.respondent, respondent);">
      </div>
      <div class="form-field">
        <label>메모 (선택)</label>
        <input type="text" value="${escapeHtml(respondent.memo)}" placeholder="예: 1차 검사"
          oninput="respondent.memo=this.value; saveJSON(LS.respondent, respondent);">
      </div>
    </div>`;
}

/* 검사 시작 시 진행 방식(임상심리사용 / 검사대상자용)을 먼저 고른다 */
function renderTestTab(){
  if(!testMode) return renderModeSelect();
  if(testMode==='clinician') return renderClinicianTest();
  return subjectStarted ? renderSubjectRunning() : renderSubjectIntro();
}

function chooseMode(mode){
  testMode = mode;
  subjectStarted = false;
  saveJSON(LS.mode, mode);
  render();
}
function backToModeSelect(){
  testMode = null;
  subjectStarted = false;
  saveJSON(LS.mode, null);
  render();
}

        <p class="intro-lead">
          미완성 문장을 자연스럽게 이어 씀으로써 성격·정서·대인관계에 대한 태도를 살펴보는 대표적인 투사적 심리검사입니다.

        <div class="feature-grid">

            </div>

            <div class="feature-icon">${icon('pencil')}</div>

              <strong>Ⅱ 문항 관리</strong>

          </div>

            <div class="feature-icon">${icon('chart')}</div>

      <div class="card-body">${respondentFields()}</div>
    </div>

    <div class="card">

        <div class="mode-grid">
          <button class="mode-card" onclick="chooseMode('clinician')">

function renderSubjectIntro(){
  const total = items.length, done = answeredCount();
  return `
    <div class="card">
      <div class="card-header">
        <h2>${icon('userCircle')} 응답자 정보</h2>
        <span class="badge">${escapeHtml(new Date().toLocaleDateString('ko-KR'))}</span>
      </div>
      <div class="card-body">${respondentFields()}</div>
    </div>

    <div class="card">
      <div class="card-body" style="text-align:center;padding:44px 24px;">
        <button class="mode-switch" onclick="backToModeSelect()">◀ 진행 방식 다시 선택</button>
        <h2 style="margin-bottom:10px;">검사대상자 모드</h2>
        <p class="mode-intro" style="max-width:420px;margin:0 auto 26px;">
          총 ${total}문항이 한 번에 한 문장씩 제시됩니다. 화면에 나온 문장을 이어서 완성해 주세요.
          문항마다 응답까지 걸린 시간이 자동으로 기록되어 리포트에서 함께 확인할 수 있습니다.
          ${done>0 ? `<br><br>이미 응답한 ${done}개 문항이 있어 이어서 진행합니다.` : ''}
        </p>
        <button class="btn btn-primary" onclick="beginSubjectTest()">검사 시작</button>
      </div>
    </div>`;
}

function firstUnansweredIndex(){
  const i = items.findIndex(it => !(responses[it.id]||'').trim());
  return i===-1 ? 0 : i;
}
function startSubjectItem(){ subjectShownAt = Date.now(); }
function beginSubjectTest(){
  subjectIdx = firstUnansweredIndex();
  subjectStarted = true;
  startSubjectItem();
  render();
}
function recordCurrentSubjectAnswer(){
  const it = items[subjectIdx]; if(!it) return;
  const el = document.getElementById('subjectAnswerInput');
  if(el){ responses[it.id] = el.value; saveJSON(LS.responses, responses); }
  if(subjectShownAt!=null && itemTimings[it.id]==null){
    itemTimings[it.id] = Date.now() - subjectShownAt;
    saveJSON(LS.timings, itemTimings);
  }
}
function subjectNext(){
  recordCurrentSubjectAnswer();
  if(subjectIdx < items.length-1){ subjectIdx++; startSubjectItem(); render(); }
}
function subjectPrev(){
  recordCurrentSubjectAnswer();
  if(subjectIdx>0){ subjectIdx--; startSubjectItem(); render(); }
}
function subjectFinish(){
  recordCurrentSubjectAnswer();
  subjectStarted = false;
  submitTest();
}

  responses[id] = val;

function updateItemStem(id, val){
  const it = items.find(x=>x.id===id); if(!it) return;
  it.stem = val; saveJSON(LS.items, items);
}
function updateItemDomain(id, val){
  const it = items.find(x=>x.id===id); if(!it) return;
  it.domain = val; saveJSON(LS.items, items);
}
function deleteItem(id){
  if(!confirm('이 문항을 삭제할까요?')) return;
  items = items.filter(x=>x.id!==id);
  saveJSON(LS.items, items);
  render();
}
function addItem(){
  items.push({ id: nextItemId(), domain: DOMAINS[0].id, stem: '새 문항을 입력하세요' });
  saveJSON(LS.items, items);
  render();
}
function moveItem(id, dir){
  const i = items.findIndex(x=>x.id===id);
  const j = i+dir;
  if(i<0 || j<0 || j>=items.length) return;
  [items[i], items[j]] = [items[j], items[i]];
  saveJSON(LS.items, items);
  render();
}
function resetItems(){
  if(!confirm('현재 문항 구성을 기본 50문항으로 되돌릴까요? 되돌릴 수 없습니다.')) return;
  items = DEFAULT_ITEMS.map(x=>({...x}));
  saveJSON(LS.items, items);
  render();
}
function shuffleItems(){
  if(!confirm('문항 순서를 무작위로 섞을까요? 문항 번호(#)가 새로 배정됩니다.')) return;
  for(let i=items.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  saveJSON(LS.items, items);
  render();
}
function exportItems(){
  const blob = new Blob([JSON.stringify(items, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'sct_items.json'; a.click();
  URL.revokeObjectURL(url);
}
function importItems(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data)) throw new Error('배열 형식이 아닙니다.');
      const valid = data.every(x => x && typeof x.stem==='string' && DOMAINS.some(d=>d.id===x.domain));
      if(!valid) throw new Error('domain/stem 형식이 올바르지 않습니다.');
      items = data.map((x,i)=>({ id: i+1, domain:x.domain, stem:x.stem }));
      saveJSON(LS.items, items);
      render();
      alert('문항을 불러왔습니다.');
    }catch(e){
      alert('JSON을 불러오지 못했습니다: '+e.message);
    }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

function renderTimingCard(meta, answers){
  if(meta.testMode!=='subject' || meta.totalTimeMs==null) return '';
  const timed = answers.items.filter(x=>x.response_time_ms!=null);
  if(!timed.length) return '';
  const byDomain = {};
  timed.forEach(x=>{ (byDomain[x.domain_id] ||= []).push(x.response_time_ms); });
  const domainRows = DOMAINS.filter(d=>byDomain[d.id]).map(d=>{
    const arr = byDomain[d.id];
    const avg = arr.reduce((a,b)=>a+b,0)/arr.length;
    return `<div class="timing-row"><span class="t-label">${escapeHtml(d.name)}</span><span class="t-val">평균 ${formatMs(avg)}</span></div>`;
  }).join('');
  const slowest = timed.reduce((a,b)=>b.response_time_ms>a.response_time_ms?b:a);
  const fastest = timed.reduce((a,b)=>b.response_time_ms<a.response_time_ms?b:a);
  return `
    <div class="card">
      <div class="card-header">
        <h2>${icon('clock')} 응답 시간</h2>
        <span class="badge">검사대상자 모드 · 총 ${formatMs(meta.totalTimeMs)}</span>
      </div>
      <div class="card-body">
        ${domainRows}
        <div class="timing-row"><span class="t-label">가장 오래 걸린 문항</span><span class="t-val">"${escapeHtml(slowest.stem)}" · ${formatMs(slowest.response_time_ms)}</span></div>
        <div class="timing-row"><span class="t-label">가장 빨리 응답한 문항</span><span class="t-val">"${escapeHtml(fastest.stem)}" · ${formatMs(fastest.response_time_ms)}</span></div>
      </div>
    </div>`;
}

/* ──────────────────────────────────────────
   ④ 일괄 처리 탭 — 샘플 양식 다운로드 · 업로드 · 개인별 리포트 ZIP 생성

function csvEscape(v){
  const s = String(v ?? '');
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function toCsv(rows){
  return rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
}
function parseCsv(text){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field += c;
    }else{
      if(c==='"') inQuotes = true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ /* \n 처리 시 함께 반영됨 */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function sanitizeFileName(s){
  return String(s).replace(/[\\/:*?"<>|]/g,'_').trim() || '무명';
}
function hasEmbeddedKey(){
  const k = EMBEDDED_API_KEY.trim();
  return !!(k && k.startsWith('sk-') && !k.includes('여기에'));
}

          <button class="btn btn-primary" onclick="downloadBatchTemplate()">⭳ 샘플 양식 다운로드 (CSV)</button>
        </div>
        <p class="muted" style="margin-bottom:20px;line-height:1.7;">
          양식에는 현재 문항 구성대로 <b>번호·영역·문항</b>이 이미 채워져 있습니다. <b>이름</b>과 <b>응답</b> 열만 채우면 되고,
          응답자가 여러 명이면 문항 ${items.length}행 전체를 복사해서 이어 붙인 뒤 이름만 바꿔주세요 (한 파일에 여러 명이 들어가도 됩니다).
          Excel에서 편집한 뒤 <b>CSV(쉼표로 분리) 형식으로 저장</b>해서 업로드해 주세요.
        </p>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="document.getElementById('batchFile').click()">⭱ 작성한 양식 업로드 · 일괄 리포트 생성</button>
          <input type="file" id="batchFile" accept=".csv,text/csv" style="display:none" onchange="handleBatchUpload(event)">
        </div>
        <div id="batchStatus" style="margin-top:18px;"></div>
      </div>
    </div>`;
}

function downloadBatchTemplate(){
  const header = ['번호','영역','문항','이름','응답'];
  const rows = items.map((it,i)=>[i+1, domainOf(it.domain).name, it.stem, '홍길동', '']);
  const csv = '﻿' + toCsv([header, ...rows]);
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'sct_batch_template.csv'; a.click();
  URL.revokeObjectURL(url);
}

function matchItemForRow(row){
  const idx = parseInt(row['번호'], 10) - 1;
  const stem = (row['문항']||'').trim();
  if(idx>=0 && idx<items.length && items[idx].stem.trim()===stem) return items[idx];
  const byStem = items.find(it=>it.stem.trim()===stem);
  if(byStem) return byStem;
  return (idx>=0 && idx<items.length) ? items[idx] : null;
}

async function handleBatchUpload(evt){
  const file = evt.target.files[0]; if(!file) return;
  const statusEl = document.getElementById('batchStatus');
  let text;
  try{ text = await file.text(); }
  catch(e){ alert('파일을 읽지 못했습니다: '+e.message); evt.target.value=''; return; }

  const rows = parseCsv(text);
  if(rows.length < 2){ alert('업로드한 파일에 데이터가 없습니다.'); evt.target.value=''; return; }

  const header = rows[0].map(h=>h.trim());
  const iName = header.indexOf('이름'), iNum = header.indexOf('번호'), iStem = header.indexOf('문항'), iAns = header.indexOf('응답');
  if(iName===-1 || iAns===-1){
    alert('CSV 헤더에 "이름"과 "응답" 열이 필요합니다. 샘플 양식을 기준으로 작성해 주세요.');
    evt.target.value=''; return;
  }

  const byPerson = {};
  rows.slice(1).forEach(r=>{
    const name = (r[iName]||'').trim();
    if(!name) return;
    (byPerson[name] ||= []).push({
      '번호': iNum>-1 ? r[iNum] : '',
      '문항': iStem>-1 ? r[iStem] : '',
      '응답': iAns>-1 ? r[iAns] : '',
    });
  });
  const names = Object.keys(byPerson);
  if(!names.length){
    alert('유효한 응답자 데이터를 찾지 못했습니다. "이름" 열이 비어있지 않은지 확인해 주세요.');
    evt.target.value=''; return;
  }

  const model = document.getElementById('modelSelect').value;
  const keyNote = hasEmbeddedKey() ? `OpenAI API (${model})` : 'AI 키 미설정 → 간이 요약';
  if(!confirm(`${names.length}명의 응답을 찾았습니다. 지금 일괄로 리포트를 생성할까요?\n분석 방식: ${keyNote}`)){
    evt.target.value=''; return;
  }

  const overlay = document.getElementById('loadingOverlay');
  const overlayText = overlay.querySelector('.muted');
  overlay.classList.add('show');

  const apiKey = EMBEDDED_API_KEY.trim();
  const useAi = hasEmbeddedKey();
  const pageCss = document.querySelector('style').textContent;
  const zip = new ZipWriter();
  const results = []; // { name, ok, mode }

  try{
    for(let n=0; n<names.length; n++){
      const name = names[n];
      overlayText.textContent = `${name} 님 리포트를 생성하는 중입니다… (${n+1}/${names.length})`;

      const answerMap = {};
      byPerson[name].forEach(row=>{
        const it = matchItemForRow(row);
        if(it) answerMap[it.id] = (row['응답']||'').trim();
      });
      const payload = {
        respondent: name,
        items: items.map(it=>({
          domain_id: it.domain,
          domain_name: domainOf(it.domain).name,
          stem: it.stem,
          answer: answerMap[it.id] || '',
          response_time_ms: null,
        })),
      };

      let result, mode;
      if(useAi){
        try{ result = await callOpenAI(apiKey, model, payload); mode = 'ai'; }
        catch(err){ result = localHeuristicReport(payload); mode = 'local'; }
      }else{
        result = localHeuristicReport(payload);
        mode = 'local';
      }
      const meta = {
        respondentName: name,
        generatedAt: new Date().toLocaleString('ko-KR'),
        mode, model,
        testMode: 'batch',
        totalTimeMs: null,
      };
      zip.addFile(`SCT_리포트_${sanitizeFileName(name)}.html`, buildStandaloneReportDoc(name, result, meta, payload, pageCss));
      results.push({ name, mode });
    }

    const zipBlob = zip.build();
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `sct_batch_reports_${stamp}.zip`; a.click();
    URL.revokeObjectURL(url);

    statusEl.innerHTML = `
      <div class="card" style="box-shadow:none;">
        <div class="card-header"><h2>처리 결과</h2><span class="badge">${results.length}명 완료</span></div>
        <div class="card-body">
          ${results.map(r=>`<div class="timing-row"><span class="t-label">${escapeHtml(r.name)}</span><span class="t-val">${r.mode==='ai'?'OpenAI 분석':'간이 요약'} · 완료</span></div>`).join('')}
        </div>
      </div>`;
  } finally {
    overlay.classList.remove('show');
    evt.target.value = '';
  }
}

/* 최소 ZIP(store, 무압축) 작성기 — 외부 라이브러리 없이 개인별 리포트를 하나의 zip으로 묶기 위함 */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){
    let c = n;
    for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let crc = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ bytes[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
class ZipWriter{
  constructor(){ this.files = []; }
  addFile(name, content){
    this.files.push({ name, bytes: new TextEncoder().encode(content) });
  }
  build(){
    const encoder = new TextEncoder();
    const localParts = [];
    const centralParts = [];
    let offset = 0;
    const dosTime = 0, dosDate = 0x21; // 1980-01-01, 무압축 저장이라 의미 없는 고정값

    for(const f of this.files){
      const nameBytes = encoder.encode(f.name);
      const crc = crc32(f.bytes);
      const size = f.bytes.length;

      const local = new Uint8Array(30 + nameBytes.length);
      const ldv = new DataView(local.buffer);
      ldv.setUint32(0, 0x04034b50, true);
      ldv.setUint16(4, 20, true);
      ldv.setUint16(6, 0x0800, true); // UTF-8 파일명 플래그
      ldv.setUint16(8, 0, true);
      ldv.setUint16(10, dosTime, true);
      ldv.setUint16(12, dosDate, true);
      ldv.setUint32(14, crc, true);
      ldv.setUint32(18, size, true);
      ldv.setUint32(22, size, true);
      ldv.setUint16(26, nameBytes.length, true);
      ldv.setUint16(28, 0, true);
      local.set(nameBytes, 30);
      localParts.push(local, f.bytes);

      const central = new Uint8Array(46 + nameBytes.length);
      const cdv = new DataView(central.buffer);
      cdv.setUint32(0, 0x02014b50, true);
      cdv.setUint16(4, 20, true);
      cdv.setUint16(6, 20, true);
      cdv.setUint16(8, 0x0800, true); // UTF-8 파일명 플래그
      cdv.setUint16(10, 0, true);
      cdv.setUint16(12, dosTime, true);
      cdv.setUint16(14, dosDate, true);
      cdv.setUint32(16, crc, true);
      cdv.setUint32(20, size, true);
      cdv.setUint32(24, size, true);
      cdv.setUint16(28, nameBytes.length, true);
      cdv.setUint16(30, 0, true);
      cdv.setUint16(32, 0, true);
      cdv.setUint16(34, 0, true);
      cdv.setUint16(36, 0, true);
      cdv.setUint32(38, 0, true);
      cdv.setUint32(42, offset, true);
      central.set(nameBytes, 46);
      centralParts.push(central);

      offset += local.length + f.bytes.length;
    }

    const centralSize = centralParts.reduce((s,p)=>s+p.length, 0);
    const centralOffset = offset;
    const end = new Uint8Array(22);
    const edv = new DataView(end.buffer);
    edv.setUint32(0, 0x06054b50, true);
    edv.setUint16(4, 0, true);
    edv.setUint16(6, 0, true);
    edv.setUint16(8, this.files.length, true);
    edv.setUint16(10, this.files.length, true);
    edv.setUint32(12, centralSize, true);
    edv.setUint32(16, centralOffset, true);
    edv.setUint16(20, 0, true);

    return new Blob([...localParts, ...centralParts, end], { type: 'application/zip' });
  }
}

/* ──────────────────────────────────────────
   AI 분석: OpenAI Structured Outputs
   ────────────────────────────────────────── */
function buildResponseSchema(){
  const domainIds = DOMAINS.map(d=>d.id);
  return {
    name: 'sct_report',
    strict: true,
    schema: {
      type: 'object',
      properties: {
        overall_summary: { type:'string', description:'전체 프로파일 종합 요약' },
        overall_tone: { type:'string', enum:['긍정적','중립적','다소_우려','주의_필요'] },
        strengths: { type:'array', items:{ type:'string' } },
        watch_points: { type:'array', items:{ type:'string' } },
        domains: {
          type:'array',
          items: {
            type:'object',
            properties:{
              domain_id: { type:'string', enum: domainIds },
              domain_name: { type:'string' },
              summary: { type:'string' },
              tone: { type:'string', enum:['긍정적','중립적','다소_우려','주의_필요'] },
              key_themes: { type:'array', items:{ type:'string' } },
            },
            required:['domain_id','domain_name','summary','tone','key_themes'],
            additionalProperties:false,
          },
        },
        recommendation: { type:'string' },
      },
      required:['overall_summary','overall_tone','strengths','watch_points','domains','recommendation'],
      additionalProperties:false,
    },
  };
}

const SYSTEM_PROMPT = `당신은 임상심리 보조 도구로서 문장완성검사(SCT) 응답을 분석하여 요약 리포트를 작성합니다.
규칙:
1. 입력은 여러 영역(가족, 이성·결혼, 대인관계, 자기개념, 정서·욕구)으로 구분된 문장완성 응답 목록입니다.
2. 실제로 입력에 존재하는 영역에 대해서만 domains 배열 항목을 작성하세요.
3. 각 영역별로 응답에 나타난 주요 주제, 정서적 톤(긍정적/중립적/다소_우려/주의_필요), 반복되는 표현을 근거로 간결하고 구체적으로 요약하세요.
4. 전체 프로파일에 대한 종합 요약과 강점, 주의가 필요한 지점, 권고 사항을 제시하세요.
5. 이 분석은 임상적 진단이 아니라 참고 자료임을 전제로 하며, 자해·자살·타해 등 위기 신호로 해석될 수 있는 표현이 있으면 watch_points와 recommendation에 반드시 명시하고 전문기관 상담을 권고하세요.
6. 무응답 문항은 해석에서 제외하되, 무응답이 많은 영역은 특이사항으로 언급할 수 있습니다.
7. 응답자가 실제로 작성한 표현을 왜곡하거나 과장하지 말고, 특정 정신질환명을 단정적으로 진단하지 마세요.
8. 모든 출력은 한국어로 작성하세요.
9. 일부 문항에는 response_time_ms(해당 문항을 완성하는 데 걸린 시간, 밀리초)가 함께 제공될 수 있습니다. 유난히 짧거나(즉각 반응) 긴(주저·회피 가능성) 응답 시간이 관찰되면 참고 정보로 언급할 수 있으나, 이것만으로 단정적인 결론을 내리지는 마세요.`;

async function callOpenAI(apiKey, model, payload){
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization': `Bearer ${apiKey}` },
    body: JSON.stringify({
      model,
      temperature: 0.4,
      response_format: { type:'json_schema', json_schema: buildResponseSchema() },
      messages: [
        { role:'system', content: SYSTEM_PROMPT },
        { role:'user', content: JSON.stringify(payload) },
      ],
    }),
  }).then(r=>r.json());
  if(res.error) throw new Error(res.error.message);
  return JSON.parse(res.choices[0].message.content);
}

/* 키가 없을 때를 위한 규칙 기반 간이 요약 (AI 미사용 폴백) */
const NEG_WORDS = ['힘들','싫','두렵','불안','화가','외롭','우울','슬프','후회','걱정','미워','원망','죄책','스트레스'];
const POS_WORDS = ['좋아','행복','감사','사랑','자신감','편안','만족','기대','희망','든든'];

function localHeuristicReport(payload){
  const byDomain = {};
  payload.items.forEach(it=>{ (byDomain[it.domain_id] ||= []).push(it); });

  const domains = Object.keys(byDomain).map(did=>{
    const d = domainOf(did);
    const list = byDomain[did];
    const answered = list.filter(x=>x.answer && x.answer.trim());
    const blanks = list.length - answered.length;
    let pos=0, neg=0;
    answered.forEach(x=>{
      NEG_WORDS.forEach(w=>{ if(x.answer.includes(w)) neg++; });
      POS_WORDS.forEach(w=>{ if(x.answer.includes(w)) pos++; });
    });
    let tone = '중립적';
    if(neg>pos && neg>=2) tone = '다소_우려';
    if(neg>=4 && neg>pos*2) tone = '주의_필요';
    if(pos>neg && pos>=2) tone = '긍정적';
    const sample = answered.slice(0,3).map(x=>`"${x.stem} ${x.answer}"`).join(', ');
    const summary = answered.length
      ? `${d.name}에서 ${answered.length}개 문항에 응답했습니다${blanks?`(무응답 ${blanks}개)`:''}. 대표 응답 예시: ${sample || '없음'}. 긍정적 표현 ${pos}회, 부정적 표현 ${neg}회가 감지되어 전반적으로 ${toneLabel(tone)} 경향으로 추정됩니다. (AI 미사용 간이 요약)`
      : `${d.name}의 문항에 응답이 거의 없어 해석하기 어렵습니다. (AI 미사용 간이 요약)`;
    return { domain_id:did, domain_name:d.name, summary, tone, key_themes: answered.length? ['키워드 기반 간이 분석']:['무응답'] };
  });

  const totalBlanks = payload.items.filter(x=>!x.answer || !x.answer.trim()).length;
  return {
    overall_summary: `총 ${payload.items.length}개 문항 중 ${payload.items.length-totalBlanks}개에 응답했습니다. 이 요약은 OpenAI API 키가 설정되지 않아 키워드 빈도 기반의 규칙적 방식으로 생성된 간이 결과이며, 실제 서비스 배포 시 EMBEDDED_API_KEY를 설정하면 훨씬 정교한 AI 해석을 받을 수 있습니다.`,
    overall_tone: '중립적',
    strengths: ['간이 분석에서는 강점을 세부적으로 판별하지 않습니다.'],
    watch_points: totalBlanks>0 ? [`무응답 문항 ${totalBlanks}개`] : [],
    domains,
    recommendation: '보다 신뢰도 높은 해석을 위해 OpenAI API 키를 설정하거나, 전문 상담자와의 면담을 통해 결과를 함께 검토하시기 바랍니다.',
  };
}

/* ──────────────────────────────────────────
   검사 제출 & 리포트 생성
   ────────────────────────────────────────── */
async function submitTest(){
  const total = items.length;
  const done = answeredCount();
  if(done===0){ alert('최소 한 문항 이상 응답해 주세요.'); return; }
  if(done < total && !confirm(`${total}개 문항 중 ${done}개만 응답했습니다. 이대로 결과를 생성할까요?`)) return;

  const payload = {
    respondent: respondent.name || '익명',
    items: items.map(it=>({
      domain_id: it.domain,
      domain_name: domainOf(it.domain).name,
      stem: it.stem,
      answer: (responses[it.id]||'').trim(),
      response_time_ms: itemTimings[it.id] ?? null,
    })),
  };
  const timedItems = payload.items.filter(x=>x.response_time_ms!=null);
  const totalTimeMs = timedItems.reduce((sum,x)=>sum+x.response_time_ms, 0);

  const overlay = document.getElementById('loadingOverlay');
  overlay.classList.add('show');

  const apiKey = EMBEDDED_API_KEY.trim();
  const hasKey = apiKey && apiKey.startsWith('sk-') && !apiKey.includes('여기에');
  const model = document.getElementById('modelSelect').value;

  try{
    let result, mode;
    if(hasKey){
      try{
        result = await callOpenAI(apiKey, model, payload);
        mode = 'ai';
      }catch(err){
        alert('OpenAI 분석에 실패하여 간이 요약으로 대체합니다: '+err.message);
        result = localHeuristicReport(payload);
        mode = 'local';
      }
    }else{
      result = localHeuristicReport(payload);
      mode = 'local';
    }
    lastReport = {
      result,
      answers: payload,
      meta: {
        respondentName: respondent.name || '익명',
        generatedAt: new Date().toLocaleString('ko-KR'),
        mode, model,
        testMode,
        totalTimeMs: timedItems.length ? totalTimeMs : null,
      },
    };
    saveJSON(LS.report, lastReport);
    switchTab('report');
  } finally {
    overlay.classList.remove('show');
  }
}

/* ──────────────────────────────────────────
   설정 패널 & 모델 저장
   ────────────────────────────────────────── */
function toggleSettings(){
  document.getElementById('settingsPanel').classList.toggle('show');
}
function saveModel(){
  saveJSON(LS.model, document.getElementById('modelSelect').value);
}
document.addEventListener('click', (e)=>{
  const panel = document.getElementById('settingsPanel');
  const gear = document.querySelector('.gear-btn');
  if(panel.classList.contains('show') && !panel.contains(e.target) && e.target!==gear){
    panel.classList.remove('show');
  }
});

/* ──────────────────────────────────────────
   초기화
   ────────────────────────────────────────── */
(function init(){
  const savedModel = loadJSON(LS.model, 'gpt-4o');
  document.getElementById('modelSelect').value = savedModel;
  switchTab('test');
})();
</script>
